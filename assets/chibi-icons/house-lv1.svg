<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="sticker" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4.5" result="dilated"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="dilated" operator="in" result=" whiteOutline"/>
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.38" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="whiteOutline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <g filter="url(#sticker)" stroke="#3b2314" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 잔디/부두 받침대 -->
    <ellipse cx="60" cy="100" rx="44" ry="12" fill="#6ee7b7"/>
    <!-- 집 본체 (입체 3D 벽면) -->
    <path d="M26 56 L60 44 L94 56 L94 94 L60 104 L26 94 Z" fill="url(#wallGrad)"/>
    <path d="M60 44 L94 56 L94 94 L60 104 Z" fill="#bfdbfe"/>
    <!-- 귀여운 굴뚝 -->
    <rect x="74" y="24" width="12" height="22" rx="3" fill="#fb7185"/>
    <!-- 3D 치비 지붕 -->
    <path d="M18 58 L60 22 L102 58 L88 64 L60 40 L32 64 Z" fill="url(#roofGrad)"/>
    <!-- 꼭대기 깃발 -->
    <line x1="60" y1="22" x2="60" y2="8" stroke="#3b2314" stroke-width="4"/>
    <path d="M60 8 L80 14 L60 20 Z" fill="#facc15"/>
    <!-- 아치형 문 & 빛나는 창문 -->
    <path d="M46 98 L46 74 A10 10 0 0 1 66 74 L66 100 Z" fill="#f59e0b"/>
    <rect x="72" y="66" width="14" height="14" rx="3" fill="#fef08a"/>
    <rect x="32" y="66" width="10" height="12" rx="2" fill="#fef08a"/>
    <!-- 귀여운 볼터치 & 눈 -->
    <circle cx="52" cy="54" r="2.5" fill="#3b2314" stroke="none"/>
    <circle cx="68" cy="54" r="2.5" fill="#3b2314" stroke="none"/>
    <ellipse cx="47" cy="57" rx="3.5" ry="2" fill="#fb7185" stroke="none"/>
    <ellipse cx="73" cy="57" rx="3.5" ry="2" fill="#fb7185" stroke="none"/>
  
  </g>
</svg>