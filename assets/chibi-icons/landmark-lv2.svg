<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="sticker" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4.5" result="dilated"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="dilated" operator="in" result=" whiteOutline"/>
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.38" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="whiteOutline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <g filter="url(#sticker)" stroke="#3b2314" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- 황금 오라 받침대 -->
    <ellipse cx="60" cy="102" rx="48" ry="13" fill="url(#goldGrad)"/>
    <!-- 좌우 날개 타워 -->
    <rect x="18" y="60" width="22" height="38" rx="4" fill="#e0f2fe"/>
    <path d="M14 60 L29 44 L44 60 Z" fill="#38bdf8"/>
    <rect x="80" y="60" width="22" height="38" rx="4" fill="#bae6fd"/>
    <path d="M76 60 L91 44 L106 60 Z" fill="#0284c7"/>
    <!-- 중앙 초고층 황금 랜드마크 본체 -->
    <path d="M38 36 L60 26 L82 36 L86 98 L34 98 Z" fill="url(#goldGrad)"/>
    <!-- 스카이 브릿지 창문들 -->
    <rect x="45" y="46" width="30" height="10" rx="3" fill="#ffffff"/>
    <rect x="45" y="62" width="30" height="10" rx="3" fill="#ffffff"/>
    <path d="M50 98 L50 78 A10 10 0 0 1 70 78 L70 98 Z" fill="#b45309"/>
    <!-- 꼭대기 황금 왕관 돔 -->
    <path d="M36 36 L42 16 L53 26 L60 10 L67 26 L78 16 L84 36 Z" fill="#fef08a"/>
    <circle cx="60" cy="7" r="4" fill="#fb7185"/>
    <!-- 반짝이 별 -->
    <path d="M22 24 L25 30 L31 33 L25 36 L22 42 L19 36 L13 33 L19 30 Z" fill="#fef08a" stroke-width="2.5"/>
    <path d="M98 22 L100 27 L105 29 L100 31 L98 36 L96 31 L91 29 L96 27 Z" fill="#fef08a" stroke-width="2.5"/>
  
  </g>
</svg>