<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="sticker" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="4.5" result="dilated"/>
      <feFlood flood-color="#ffffff" result="white"/>
      <feComposite in="white" in2="dilated" operator="in" result=" whiteOutline"/>
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.38" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="whiteOutline"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="55%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>
  <g filter="url(#sticker)" stroke="#3b2314" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    
    <line x1="30" y1="92" x2="76" y2="46" stroke="#b45309" stroke-width="12"/>
    <line x1="30" y1="92" x2="76" y2="46" stroke="#f59e0b" stroke-width="6"/>
    <rect x="52" y="20" width="44" height="24" rx="7" transform="rotate(45 74 32)" fill="url(#goldGrad)"/>
    <path d="M26 26 L30 36 L40 40 L30 44 L26 54 L22 44 L12 40 L22 36 Z" fill="#fef08a"/>
  
  </g>
</svg>